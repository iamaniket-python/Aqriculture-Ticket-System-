{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>

  <!-- CSS -->
  <link rel="stylesheet" href="{% static 'assets/vendors/mdi/css/materialdesignicons.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/ti-icons/css/themify-icons.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/css/vendor.bundle.base.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/font-awesome/css/font-awesome.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
</head>

<body>
<div class="container-scroller">

  <!-- NAVBAR -->
  <nav class="navbar default-layout-navbar fixed-top d-flex flex-row">
    <div class="navbar-brand-wrapper">
      <a class="navbar-brand brand-logo" href="#">
        <img src="{% static 'assets/images/logo.svg' %}">
      </a>
    </div>

    <div class="navbar-menu-wrapper d-flex align-items-stretch">
      <ul class="navbar-nav navbar-nav-right">

        <!-- LOGOUT -->
        <li class="nav-item">
          <a class="nav-link" href="{% url 'staff_logout' %}">
            <i class="mdi mdi-power"></i>
          </a>
        </li>

      </ul>
    </div>
  </nav>

  <div class="container-fluid page-body-wrapper">

    <!-- SIDEBAR -->
    <nav class="sidebar sidebar-offcanvas">
      <ul class="nav">

        <!-- DASHBOARD -->
        <li class="nav-item">
          <a class="nav-link" href="{% url 'staff_dashboard' %}">
            <span class="menu-title">Dashboard</span>
            <i class="mdi mdi-home menu-icon"></i>
          </a>
        </li>

        <!-- STAFF SECTION -->
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="collapse" href="#staffMenu">
            <span class="menu-title">Staff</span>
            <i class="mdi mdi-account-multiple menu-icon"></i>
          </a>

          <div class="collapse" id="staffMenu">
            <ul class="nav flex-column sub-menu">

              <li class="nav-item">
                <a class="nav-link" href="{% url 'admin_staff_list' %}">
                  Manage Staff
                </a>
              </li>

            </ul>
          </div>
        </li>

        <!-- TICKETS -->
        <li class="nav-item">
          <a class="nav-link" href="{% url 'admin_dashboard' %}">
            <span class="menu-title">Tickets</span>
            <i class="mdi mdi-ticket menu-icon"></i>
          </a>
        </li>

      </ul>
    </nav>

    <!-- MAIN PANEL -->
    <div class="main-panel">
      <div class="content-wrapper">

        <!-- PAGE TITLE -->
        <div class="page-header">
          <h3 class="page-title">Admin Dashboard</h3>
        </div>

        <!-- CONTENT -->
        <div class="row">
          <div class="col-md-12">

            <div class="card">
              <div class="card-body">

                <h4>Welcome Admin 👋</h4>
                <p>Use sidebar to manage staff and tickets.</p>

              </div>
            </div>

          </div>
        </div>

      </div>

      <!-- FOOTER -->
      <footer class="footer text-center">
        <span>© 2026 Your Project</span>
      </footer>

    </div>
  </div>
</div>

<!-- JS -->
<script src="{% static 'assets/vendors/js/vendor.bundle.base.js' %}"></script>
<script src="{% static 'assets/js/off-canvas.js' %}"></script>
<script src="{% static 'assets/js/misc.js' %}"></script>

</body>
</html>
