{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staff Register</title>

    <link rel="stylesheet" href="{% static 'assets/vendors/mdi/css/materialdesignicons.min.css' %}"/>
    <link rel="stylesheet" href="{% static 'assets/vendors/ti-icons/css/themify-icons.css' %}"/>
    <link rel="stylesheet" href="{% static 'assets/vendors/css/vendor.bundle.base.css' %}"/>
    <link rel="stylesheet" href="{% static 'assets/vendors/font-awesome/css/font-awesome.min.css' %}"/>
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}" />
    <link rel="shortcut icon" href="{% static 'image/logo.png' %}"/>
  </head>

  <body>
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center auth">
          <div class="row flex-grow">
            <div class="col-lg-4 mx-auto">
              <div class="auth-form-light text-left p-5">

                <!-- LOGO -->
                <div class="brand-logo text-center">
                  <img src="{% static 'image/logo.png' %}" />
                </div>
                <div class="text-center">
                  <h4>New here?</h4>
                  <h6 class="font-weight-light">Create your staff account</h6>
                </div>

                <!-- ERROR / SUCCESS -->
                {% if error %}
                <div style="background:#fef2f2;color:#991b1b;padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13px;font-weight:500;border:1px solid #fca5a5;">
                  ❌ {{ error }}
                </div>
                {% endif %}

                {% if msg %}
                <div style="background:#f0fdf4;color:#166534;padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13px;font-weight:500;border:1px solid #bbf7d0;">
                  {{ msg }}
                </div>
                {% endif %}

                <!-- FORM -->
                <form method="POST" class="pt-3">
                  {% csrf_token %}

                  <!-- Username -->
                  <div class="form-group">
                    <label style="font-size:13px;font-weight:600;color:#374151;">
                      Username <span style="color:red;">*</span>
                    </label>
                    <input
                      type="text"
                      name="username"
                      class="form-control form-control-lg"
                      placeholder="Enter username"
                      required
                    />
                  </div>

                  <!-- Email -->
                  <div class="form-group">
                    <label style="font-size:13px;font-weight:600;color:#374151;">
                      Email <span style="color:red;">*</span>
                    </label>
                    <input
                      type="email"
                      name="email"
                      class="form-control form-control-lg"
                      placeholder="Enter email address"
                      required
                    />
                  </div>

                  <!-- Password -->
                  <div class="form-group" style="position:relative;">
                    <label style="font-size:13px;font-weight:600;color:#374151;">
                      Password <span style="color:red;">*</span>
                    </label>
                    <input
                      type="password"
                      name="password"
                      id="staffRegPassword"
                      class="form-control form-control-lg"
                      placeholder="Enter password"
                      required
                      style="padding-right:45px;"
                    />
                    <span
                      onclick="togglePassword('staffRegPassword', this)"
                      style="position:absolute;right:15px;bottom:12px;cursor:pointer;color:#9ca3af;">
                      <i class="mdi mdi-eye-outline" style="font-size:20px;"></i>
                    </span>
                  </div>

                  <div class="mt-3 d-grid gap-2">
                    <button
                      type="submit"
                      class="btn btn-block btn-gradient-primary btn-lg font-weight-medium"
                    >
                      SIGN UP
                    </button>
                  </div>
                </form>

                <!-- LOGIN LINK -->
                <div class="text-center mt-4 font-weight-light">
                  Already have an account?
                  <a href="{% url 'staff_login' %}" class="text-primary">Login</a>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="{% static 'assets/vendors/js/vendor.bundle.base.js' %}"></script>
    <script src="{% static 'assets/js/off-canvas.js' %}"></script>
    <script src="{% static 'assets/js/misc.js' %}"></script>
    <script src="{% static 'assets/js/settings.js' %}"></script>
    <script src="{% static 'assets/js/todolist.js' %}"></script>
    <script src="{% static 'assets/js/jquery.cookie.js' %}"></script>

    <!-- Password Toggle -->
    <script>
    function togglePassword(fieldId, icon) {
      const field = document.getElementById(fieldId);
      if (field.type === 'password') {
        field.type = 'text';
        icon.innerHTML = '<i class="mdi mdi-eye-off-outline" style="font-size:20px;"></i>';
      } else {
        field.type = 'password';
        icon.innerHTML = '<i class="mdi mdi-eye-outline" style="font-size:20px;"></i>';
      }
    }
    </script>

  </body>
</html>
