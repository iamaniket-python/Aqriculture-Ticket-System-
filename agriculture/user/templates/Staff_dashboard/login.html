{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staff Login</title>

    <!-- CSS -->
    <link
      rel="stylesheet"
      href="{% static 'assets/vendors/mdi/css/materialdesignicons.min.css' %}"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/vendors/ti-icons/css/themify-icons.css' %}"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/vendors/css/vendor.bundle.base.css' %}"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/vendors/font-awesome/css/font-awesome.min.css' %}"
    />
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}" />
    <link rel="shortcut icon" href="{% static 'image/logo.png' %}" />
  </head>

  <body>
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center auth">
          <div class="row flex-grow">
            <div class="col-lg-4 mx-auto">
              <div class="auth-form-light text-left p-5">
                <div class="brand-logo text-center">
                  <img src="{% static 'image/logo.png' %}" />
                </div>
                <div class="text-center">
                  <h4>Staff Login</h4>
                  <h6 class="font-weight-light">
                    Login only after admin approval
                  </h6>
                </div>

                {% if error %}
                <div style="color: red; margin-bottom: 10px">{{ error }}</div>
                {% endif %}

                <form method="POST" class="pt-3">
                  {% csrf_token %}

                  <div class="form-group">
                    <input
                      type="email"
                      name="username"
                      class="form-control"
                      placeholder="Email Address"
                      required
                    />
                    />
                  </div>

                  <!-- ✅ Password with eye toggle -->
                  <div class="form-group" style="position: relative">
                    <input
                      type="password"
                      name="password"
                      id="staffPassword"
                      class="form-control"
                      placeholder="Password"
                      required
                      style="padding-right: 45px"
                    />
                    <span
                      onclick="togglePassword('staffPassword', this)"
                      style="
                        position: absolute;
                        right: 15px;
                        top: 50%;
                        transform: translateY(-50%);
                        cursor: pointer;
                        color: #9ca3af;
                      "
                    >
                      <i
                        class="mdi mdi-eye-outline"
                        style="font-size: 20px"
                      ></i>
                    </span>
                  </div>

                  <button type="submit" class="btn btn-gradient-primary w-100">
                    LOGIN
                  </button>
                  <div class="text-center mt-3">
                    <a href="{% url 'staff_register' %}" class="text-primary">
                      Register as Staff
                    </a>
                  </div>
                </form>

                <p class="text-center mt-3 text-muted">
                  Only approved staff can login
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JS -->
    <script src="{% static 'assets/vendors/js/vendor.bundle.base.js' %}"></script>
    <script src="{% static 'assets/js/off-canvas.js' %}"></script>
    <script src="{% static 'assets/js/misc.js' %}"></script>
    <script src="{% static 'assets/js/settings.js' %}"></script>
    <script src="{% static 'assets/js/todolist.js' %}"></script>
    <script src="{% static 'assets/js/jquery.cookie.js' %}"></script>

    <!-- ✅ Password Toggle Script -->
    <script>
      function togglePassword(fieldId, icon) {
        const field = document.getElementById(fieldId);
        if (field.type === "password") {
          field.type = "text";
          icon.innerHTML =
            '<i class="mdi mdi-eye-off-outline" style="font-size:20px;"></i>';
        } else {
          field.type = "password";
          icon.innerHTML =
            '<i class="mdi mdi-eye-outline" style="font-size:20px;"></i>';
        }
      }
    </script>
  </body>
</html>
