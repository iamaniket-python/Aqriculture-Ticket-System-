{% extends 'Base/base.html' %}
{% block title %}Create Ticket{% endblock %}

{% block content %}
{% load static %}

<div class="ticket-wrapper">
  <div class="ticket-card">

    <h2>🎫 Create Ticket</h2>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <!-- 1. SELECT ORDER -->
      <label>Select Your Order ID</label>
      <select name="purchase" id="purchaseSelect" required>
        <option value="">Select Order</option>

        {% for p in purchases %}
          <option value="{{ p.id }}" data-product="{{ p.product_name }}">
            {{ p.purchase_id }}
          </option>
        {% empty %}
          <option disabled>No purchases found</option>
        {% endfor %}
      </select>

      <!-- 🔥 AUTO PRODUCT SHOW -->
      <p id="productName" style="color:#6b7280; margin-top:5px;"></p>

      <!-- 2. CATEGORY -->
      <label>Category</label>
      <select name="category" required>
        <option value="">Select Category</option>
        <option value="Product Issue">Product Issue</option>
        <option value="Delivery Issue">Delivery Issue</option>
        <option value="Payment Issue">Payment Issue</option>
      </select>

      <!-- 3. OTHER -->
      <label>Other (Optional)</label>
      <input name="other" placeholder="Any extra info (optional)" />

      <!-- 4. TITLE -->
      <label>Title</label>
      <input name="title" placeholder="Enter Issue Title" required />

      <!-- 5. DESCRIPTION -->
      <label>Description</label>
      <textarea name="description" placeholder="Describe your issue" required></textarea>

      <!-- 6. IMAGES -->
      <label>📷 Upload Images</label>
      <input type="file" name="images" multiple />

      <!-- 7. DOCUMENT -->
      <label>📄 Upload Document</label>
      <input type="file" name="document" />

      <button type="submit">Submit Ticket</button>

    </form>
  </div>
</div>

<!-- 🔥 JS FOR AUTO PRODUCT -->
<script>
document.getElementById("purchaseSelect").addEventListener("change", function() {
    let selected = this.options[this.selectedIndex];
    let product = selected.getAttribute("data-product");

    document.getElementById("productName").innerText = product 
        ? "Product: " + product 
        : "";
});
</script>

{% endblock %}
