{% extends 'Base/base.html' %} {% block title %}Create Ticket{% endblock %}
{%block content %} {% load static %}

<br><br><br>

<div class="ticket-wrapper">
  <div class="ticket-card">
    <h2>🎫 Create Ticket</h2>

    <!-- STEP 1: ORDER SELECT -->
    <form method="GET">
      <label>Select Your Order ID</label>
      <select name="purchase" onchange="this.form.submit()">
        <option value="">Select Order</option>
        {% for p in purchases %}
          <option value="{{ p.purchase_id }}"
            {% if selected_purchase == p.purchase_id %}selected{% endif %}>
            {{ p.purchase_id }}
          </option>
        {% endfor %}
      </select>
    </form>

    <br>

    <!-- STEP 2: MAIN FORM -->
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <input type="hidden" name="purchase" value="{{ selected_purchase }}">

      <!-- PRODUCT -->
      <label>Select Product</label>
      {% if selected_purchase %}
        <select name="product" required>
          <option value="">Select Product</option>
          {% for item in products %}
            <option value="{{ item.product_name }}"
              {% if selected_product == item.product_name %}selected{% endif %}>
              {{ item.product_name }}
            </option>
          {% endfor %}
        </select>
      {% else %}
        <select disabled>
          <option>Select order first</option>
        </select>
      {% endif %}

      <!-- CATEGORY — Other option added -->
      <label>Category</label>
      <select name="category" id="categorySelect" required onchange="handleCategory(this.value)">
        <option value="">Select Category</option>
        <option value="Product Issue">Product Issue</option>
        <option value="Delivery Issue">Delivery Issue</option>
        <option value="Payment Issue">Payment Issue</option>
        <option value="Other">Other</option>
      </select>

      <!-- OTHER BOX — sirf tab dikhega jab Other select ho -->
      <div id="otherBox">
        <label>✏️ Please specify</label>
        <input
          type="text"
          id="otherInput"
          name="other"
          placeholder="Describe your issue category..."
          style="width:100%;"
        />
      </div>

      <!-- TITLE -->
      <label>Title</label>
      <input name="title" placeholder="Enter Issue Title" required />

      <!-- DESCRIPTION -->
      <label>Description</label>
      <textarea name="description" placeholder="Describe your issue" required></textarea>

      <!-- IMAGES -->
      <label>📷 Upload Images</label>
      <input
        type="file"
        id="imageInput"
        name="images"
        multiple
        accept="image/*"
        style="display:none"
      />
      <button type="button" onclick="openFilePicker()" class="upload-btn">
        + Select Images
      </button>
      <div id="previewContainer" class="preview-box"></div>

      <!-- DOCUMENT -->
      <label>📄 Upload Document</label>
      <input type="file" name="document" />

      <button type="submit">Submit Ticket</button>
    </form>
  </div>
</div>

<script>
  // ✅ Category — Other select hone pe box show/hide
  function handleCategory(value) {
    let otherBox   = document.getElementById("otherBox");
    let otherInput = document.getElementById("otherInput");

    if (value === "Other") {
      otherBox.style.display = "block";
      otherInput.required    = true;    // Other select kiya toh fill karna zaroori
    } else {
      otherBox.style.display = "none";
      otherInput.required    = false;
      otherInput.value       = "";      // clear karo
    }
  }

  // ✅ Image preview
  document.addEventListener("DOMContentLoaded", function () {
    function openFilePicker() {
      document.getElementById("imageInput").click();
    }
    window.openFilePicker = openFilePicker;

    let selectedFiles = [];

    document.getElementById("imageInput").addEventListener("change", function (e) {
      Array.from(e.target.files).forEach(file => selectedFiles.push(file));
      renderPreview();
    });

    function renderPreview() {
      let container = document.getElementById("previewContainer");
      container.innerHTML = "";

      selectedFiles.forEach((file, index) => {
        let reader = new FileReader();
        reader.onload = function (e) {
          let div = document.createElement("div");
          div.classList.add("preview-item");
          div.innerHTML = `
            <img src="${e.target.result}">
            <div class="remove-btn" onclick="removeImage(${index})">✖</div>
          `;
          container.appendChild(div);
        };
        reader.readAsDataURL(file);
      });

      updateFileInput();
    }

    window.removeImage = function (index) {
      selectedFiles.splice(index, 1);
      renderPreview();
    };

    function updateFileInput() {
      let dt = new DataTransfer();
      selectedFiles.forEach(file => dt.items.add(file));
      document.getElementById("imageInput").files = dt.files;
    }
  });
</script>

{% endblock %}
