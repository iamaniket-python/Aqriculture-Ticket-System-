{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="{% static 'image/logo.png' %}"/>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f5f5f7;
  font-family: 'Plus Jakarta Sans', sans-serif;
  padding: 1rem;
}

.card {
  background: #ffffff;
  border: 1px solid #e8e8ed;
  border-radius: 20px;
  padding: 2.5rem 2rem;
  width: 100%;
  max-width: 360px;
  text-align: center;
}

/* Logo */
.logo-wrap {
  width: 110px;
  height: 110px;
  border-radius: 18px;
  background: #f5f5f7;
  border: 1px solid #e8e8ed;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.5rem;
  overflow: hidden;
}

.logo-wrap img {
  width: 80px;
  height: 80px;
  object-fit: contain;
}

/* Text */
.card h1 {
  font-size: 21px;
  font-weight: 600;
  color: #1a1a2e;
  margin-bottom: 6px;
}

.card .subtitle {
  font-size: 13px;
  color: #6b7280;
  margin-bottom: 2rem;
  line-height: 1.6;
}

/* Primary button */
.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 10px;
  border: none;
  background: #1a1a2e;
  color: #ffffff;
  cursor: pointer;
  text-decoration: none;
  font-family: 'Plus Jakarta Sans', sans-serif;
  transition: opacity 0.15s, transform 0.1s;
}

.btn-primary:hover { opacity: 0.88; }
.btn-primary:active { transform: scale(0.99); }

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 1.25rem 0;
  color: #d1d5db;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #f3f4f6;
}

/* Admin row */
.admin-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 14px;
  border-radius: 10px;
  border: 1px solid #e8e8ed;
  background: #f9fafb;
}

.admin-row span {
  font-size: 13px;
  color: #6b7280;
}

.admin-row a {
  font-size: 13px;
  font-weight: 600;
  color: #1a1a2e;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
  transition: opacity 0.15s;
}

.admin-row a:hover { opacity: 0.7; }

/* Footer */
.footer-note {
  font-size: 11px;
  color: #9ca3af;
  margin-top: 1.5rem;
}

@media (max-width: 400px) {
  .card { padding: 2rem 1.25rem; }
}
</style>
</head>

<body>

<div class="card">

  <div class="logo-wrap">
    <img src="{% static 'image/logo.png' %}" alt="Agrizfarm Logo">
  </div>

  <h1>Agrizfarm Support</h1>
  <p class="subtitle">Raise and track your support tickets quickly and easily.</p>

  <a href="{% url 'login' %}" class="btn-primary">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
    </svg>
    User login
  </a>

  <div class="divider">or</div>

  <div class="admin-row">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <span>Admin access</span>
    <a href="{% url 'admin_login' %}">
      Login
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
    </a>
  </div>

  <p class="footer-note">© 2026 Agrizfarm — All rights reserved</p>

</div>

</body>
</html>
