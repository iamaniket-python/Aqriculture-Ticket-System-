{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Admin{% endblock %}</title>

  <!-- CSS -->
  <link rel="stylesheet" href="{% static 'assets/vendors/mdi/css/materialdesignicons.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/ti-icons/css/themify-icons.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/css/vendor.bundle.base.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/font-awesome/css/font-awesome.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/bootstrap-datepicker/bootstrap-datepicker.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">

  {% block extra_css %}{% endblock %}
</head>

<body>
<div class="container-scroller">

  <!-- NAVBAR -->
  <nav class="navbar default-layout-navbar col-lg-12 col-12 p-0 fixed-top d-flex flex-row">
    
    <div class="text-center navbar-brand-wrapper d-flex align-items-center justify-content-start">
      <a class="navbar-brand brand-logo" href="#"><img src="{% static 'assets/images/logo.svg' %}" /></a>
      <a class="navbar-brand brand-logo-mini" href="#"><img src="{% static 'assets/images/logo-mini.svg' %}" /></a>
    </div>

    <div class="navbar-menu-wrapper d-flex align-items-stretch">

      <button class="navbar-toggler navbar-toggler align-self-center" type="button" data-toggle="minimize">
        <span class="mdi mdi-menu"></span>
      </button>

      <ul class="navbar-nav navbar-nav-right">

        <!-- USER -->
        <li class="nav-item nav-profile dropdown">
          <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
            <div class="nav-profile-img">
              <img src="{% static 'assets/images/faces/face1.jpg' %}">
            </div>
            <div class="nav-profile-text">
              <p class="mb-1 text-black">{{ request.user.username }}</p>
            </div>
          </a>

          <div class="dropdown-menu navbar-dropdown">
            <a class="dropdown-item" href="{% url 'logout' %}">
              <i class="mdi mdi-logout me-2 text-primary"></i> Logout
            </a>
          </div>
        </li>

      </ul>
    </div>
  </nav>

  <!-- PAGE BODY -->
  <div class="container-fluid page-body-wrapper">

    <!-- SIDEBAR -->
    <nav class="sidebar sidebar-offcanvas" id="sidebar">
      <ul class="nav">

        <li class="nav-item">
          <a class="nav-link" href="#">
            <span class="menu-title">Dashboard</span>
            <i class="mdi mdi-home menu-icon"></i>
          </a>
        </li>

        <!-- CHAT MENU -->
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="collapse" href="#chatMenu">
            <span class="menu-title">Chats</span>
            <i class="mdi mdi-chat menu-icon"></i>
          </a>

          <div class="collapse" id="chatMenu">
            <ul class="nav flex-column sub-menu">

              {% block sidebar_chats %}
              <!-- dynamic chats yaha inject karoge -->
              {% endblock %}

            </ul>
          </div>
        </li>

      </ul>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="main-panel">
      <div class="content-wrapper">

        {% block content %}
       
        {% endblock %}

      </div>

      <!-- FOOTER -->
      <footer class="footer">
        <div class="d-sm-flex justify-content-center justify-content-sm-between">
          <span class="text-muted">© 2023 BootstrapDash</span>
        </div>
      </footer>

    </div>

  </div>
</div>

<!-- JS -->
<script src="{% static 'assets/vendors/js/vendor.bundle.base.js' %}"></script>
<script src="{% static 'assets/js/off-canvas.js' %}"></script>
<script src="{% static 'assets/js/misc.js' %}"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
{}
